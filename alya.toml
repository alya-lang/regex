[package]
name = "regex"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "High-performance regular expression engine with linear-time matching, named capture groups, lookarounds, and global multilingual Unicode support"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/regex"
keywords = ["alya", "alya-lang", "package", "regex", "regexp", "pattern", "matcher"]

[dependencies]

# Optional: feature-gated API slices. Members name another feature;
# gate the using code with `@cfg(feature = "...")` (see `src/lib.alya`
# and `src/utils.alya`). `default` is active unless the caller passes
# `--no-default-features`; select features explicitly via
# `alya build/run/test/bench/install --features <a,b>`.
[features]
default = ["core", "replace", "split", "oneliners", "unicode"]
core = []
# Substitution works on compiled patterns, so it pulls the kernel in.
replace = ["core"]
# Tokenization works on compiled patterns, so it pulls the kernel in.
split = ["core"]
# One-liners compose compilation (core), substitution (replace) and
# tokenization (split); enabling them pulls those slices in.
oneliners = ["core", "replace", "split"]
# Multilingual case folding upgrades matching; the engine keeps
# ASCII-only folding without it, so slim builds still match.
unicode = ["core"]

